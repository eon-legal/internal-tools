name: Deploy Angular 18 App to Hostinger

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18  # Use Node.js 18 for Angular 18

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build the Angular app
      - name: Build Angular app
        run: npm run build -- --configuration production

      # Deploy to Hostinger via FTP
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.EON_FTP_SERVER }}  # FTP server address
          username: ${{ secrets.EON_FTP_USERNAME }}  # FTP username
          password: ${{ secrets.EON_FTP_PASSWORD }}  # FTP password
          local-dir: dist/internal-tools  # Path to the built Angular app
          server-dir: /tools  # Path to the subdomain directory on Hostinger