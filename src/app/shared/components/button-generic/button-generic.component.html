<!-- Verifica si la propiedad 'buttons' existe y tiene una propiedad 'buttons' -->
@if(buttons?.buttons) {
<div
  [ngClass]="
    buttons?.css ||
    'flex flex-column md:flex-row md:justify-content-start gap-2'
  "
>
  <!-- Itera sobre cada botón en la lista 'buttons.buttons' -->
  @for(button of buttons?.buttons; track button.id) {
  <!-- Verifica si el botón debe mostrarse usando el método 'showHideButton' -->
  @if(showHideButton(button)) {
  <!-- Componente de botón de PrimeNG -->
  <p-button
    [label]="button.label"
    [icon]="button.icon"
    [iconPos]="button.iconPos"
    [severity]="button.severity"
    [disabled]="button.disabled"
    [loading]="button.loading"
    [styleClass]="button.styleClass || ''"
    [rounded]="button.rounded"
    [raised]="button.raised"
    [outlined]="button.outlined"
    [text]="button.text"
    [size]="button.size"
    (click)="button.action()"
  >
  </p-button>
  } }
</div>
}
