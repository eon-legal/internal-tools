<p-fileUpload
  [name]="name"
  [chooseLabel]="chooseLabel"
  [uploadIcon]="uploadIcon"
  [uploadLabel]="uploadLabel"
  [cancelLabel]="cancelLabel"
  [customUpload]="true"
  [multiple]="multiple"
  [accept]="getAccept()"
  [styleClass]="!noFooter ? styleClass : 'hidden-file-list'"
  (uploadHandler)="onUpload()"
  (onSelect)="onFileSelect($event)"
  (onClear)="onClear()"
  [auto]="auto"
  [files]="files"
>
</p-fileUpload>
