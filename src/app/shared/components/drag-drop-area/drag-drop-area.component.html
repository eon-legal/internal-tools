<div
  class="drag-drop-area"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
>
  <div class="flex align-items-center justify-content-center flex-column">
    <i
      class="pi pi-cloud-upload cloud-icon border-2 border-circle p-5 text-8xl border-400"
    ></i>
    <p class="mt-4 mb-0">{{ note }}</p>
  </div>

  <ng-content select="app-file-upload" />
</div>
