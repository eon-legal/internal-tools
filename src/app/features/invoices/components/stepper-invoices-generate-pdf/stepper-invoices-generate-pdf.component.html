<!--(valueChange)="onStepChange($event)"-->
<p-stepper [value]="data()" [linear]="true" class="basis-[50rem]">
  <p-step-list>
    <p-step [value]="1">{{ nameStepOne }}</p-step>
    <p-step [value]="2">{{ nameStepTwo }}</p-step>
    <p-step [value]="3">{{ nameStepThree }}</p-step>
  </p-step-list>
  <app-stepper-context [index]="data()" [stepperButtons]="stepper">
    <ng-template #dynamicComponent></ng-template>
  </app-stepper-context>
</p-stepper>
