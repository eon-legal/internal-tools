<div class="invoice-create-page p-4">
  <!-- Page Header -->
  <div class="page-header flex justify-content-between align-items-center mb-4">
    <div class="header-content">
      <h1 class="text-3xl font-bold m-0">{{ 'invoices.combined_form.title' | translate }}</h1>
      <p class="text-color-secondary mt-1 mb-0">{{ 'invoices.destination_selector.description' | translate }}</p>
    </div>
    <p-button
      [label]="'invoices.history.title' | translate"
      icon="pi pi-list"
      (onClick)="navigateToHistory()"
      styleClass="p-button-text"
    ></p-button>
  </div>

  <!-- Combined Invoice Form with integrated action buttons -->
  <app-invoice-combined-form
    (clearAll)="cleanDataStep()"
    (generateInvoice)="generateInvoice()"
  ></app-invoice-combined-form>
</div>
