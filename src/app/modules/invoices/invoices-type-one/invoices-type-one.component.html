<div>
  <!--class="card flex justify-content-center"-->
  <p-stepper>
    <p-stepperPanel [header]="nameStepOne">
      <ng-template
        pTemplate="content"
        let-nextCallback="nextCallback"
        let-index="index"
      >
        <div class="flex flex-col h-48">
          <app-invoices-sender-form #invoicesSenderFormComponent />
        </div>

        <!--flex pt-6 justify-content-between-->
        <div
          class="flex flex-column md:flex-row md:justify-content-between gap-2"
        >
          <p-button
            label="Limpiar Todo"
            icon="pi pi pi-times"
            severity="warning"
            (click)="cleanDataStep()"
          />
          <!-- <div class="flex pt-4 justify-content-end"> -->
          <p-button
            label="Siguiente"
            icon="pi pi-arrow-right"
            iconPos="right"
            (onClick)="nextCallback.emit()"
          />
        </div>
      </ng-template>
    </p-stepperPanel>
    <p-stepperPanel [header]="nameStepThree">
      <ng-template
        pTemplate="content"
        let-prevCallback="prevCallback"
        let-nextCallback="nextCallback"
        let-index="index"
      >
        <app-contain-invoices />
        <!-- <div class="flex pt-4 justify-content-between"> -->
        <div
          class="flex flex-column md:flex-row md:justify-content-between gap-2 mt-2"
        >
          <p-button
            label="Atrás"
            icon="pi pi-arrow-left"
            (onClick)="prevCallback.emit()"
          />
          <p-button
            label="Siguiente"
            icon="pi pi-arrow-right"
            iconPos="right"
            (onClick)="nextCallback.emit()"
          />
        </div>
      </ng-template>
    </p-stepperPanel>
    <p-stepperPanel [header]="nameStepThree">
      <ng-template
        pTemplate="content"
        let-prevCallback="prevCallback"
        let-index="index"
      >
        <div class="flex flex-col h-48">
          <app-invoices-destination-form #invoicesDestinationFormComponent />
        </div>
        <div
          class="flex flex-column md:flex-row md:justify-content-between gap-2"
        >
          <!--<div class="flex pt-4 justify-content-start"> -->
          <p-button
            label="Atrás"
            icon="pi pi-arrow-left"
            (onClick)="prevCallback.emit()"
          />

          <p-button
            label="Generar Factura"
            icon="pi pi-file-pdf"
            iconPos="right"
            (onClick)="notAllowedShowPdf()"
          />
        </div>
      </ng-template>
    </p-stepperPanel>
  </p-stepper>
</div>
