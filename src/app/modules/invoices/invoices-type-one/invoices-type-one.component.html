<div class="card flex justify-center">
  <p-stepper [value]="1" class="basis-[50rem]">
    <p-step-list>
      <p-step [value]="1">{{ nameStepOne }}</p-step>
      <p-step [value]="2">{{ nameStepTwo }}</p-step>
      <p-step [value]="3">{{ nameStepThree }}</p-step>
    </p-step-list>
    <p-step-panels>
      <p-step-panel [value]="1">
        <ng-template #content let-activateCallback="activateCallback">
          <div class="flex flex-col h-48">
            <app-invoices-sender-form #invoicesSenderFormComponent />
          </div>
          <div
            class="flex flex-column md:flex-row md:justify-content-between gap-2"
          >
            <p-button
              label="Limpiar Todo"
              icon="pi pi pi-times"
              severity="warn"
              iconPos="right"
              (click)="cleanDataStep()"
            />
            <p-button
              label="Siguiente"
              icon="pi pi-arrow-right"
              iconPos="right"
              (onClick)="activateCallback(2)"
            />
          </div>
        </ng-template>
      </p-step-panel>

      <p-step-panel [value]="2">
        <ng-template #content let-activateCallback="activateCallback">
          <app-contain-invoices />
          <div
            class="flex flex-column md:flex-row md:justify-content-between gap-2"
          >
            <p-button
              label="Atrás"
              severity="secondary"
              icon="pi pi-arrow-left"
              (onClick)="activateCallback(1)"
            />
            <p-button
              label="Siguiente"
              icon="pi pi-arrow-right"
              iconPos="right"
              (onClick)="activateCallback(3)"
            />
          </div>
        </ng-template>
      </p-step-panel>

      <p-step-panel [value]="3">
        <ng-template #content let-activateCallback="activateCallback">
          <div class="flex flex-col h-48">
            <app-invoices-destination-form #invoicesDestinationFormComponent />
          </div>
          <div
            class="flex flex-column md:flex-row md:justify-content-between gap-2"
          >
            <p-button
              label="Atrás"
              severity="secondary"
              icon="pi pi-arrow-left"
              (onClick)="activateCallback(2)"
            />
            <p-button
              label="Generar Factura"
              icon="pi pi-file-pdf"
              iconPos="right"
              (onClick)="notAllowedShowPdf()"
            />
          </div>
        </ng-template>
      </p-step-panel>
    </p-step-panels>
  </p-stepper>
</div>
