<p-stepper [(value)]="data" class="basis-[50rem]">
  <p-step-list>
    <p-step [value]="1">{{ nameStepOne }}</p-step>
    <p-step [value]="2">{{ nameStepTwo }}</p-step>
    <p-step [value]="3">{{ nameStepThree }}</p-step>
  </p-step-list>
  <app-stepper-context [index]="data" [stepper]="stepper">
    @if(data === 1){
    <app-invoices-sender-form #step1 />
    } @if(data === 2){
    <app-contain-invoices #step2 />
    } @if(data === 3){
    <app-invoices-destination-form #step3 />
    }
  </app-stepper-context>
</p-stepper>
