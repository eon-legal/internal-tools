<app-drag-drop-area (fileDrop)="onDrop($event)">
  <app-file-upload
    #fileUploadComponent
    [name]="'myfile[]'"
    [chooseLabel]="chooseLabel"
    uploadIcon="pi pi-arrow-down"
    [uploadLabel]="uploadLabel"
    [cancelLabel]="cancelLabel"
    [customUpload]="true"
    [accept]="acceptedFiles"
    [styleClass]="'hidden-file-list'"
    [multiple]="true"
    [files]="myfile"
    (clean)="onClear()"
    (select)="onFileSelect($event)"
    (upload)="onUpload()"
  />
</app-drag-drop-area>

@if (errorMessage) {
<app-messages [errorMessage]="errorMessage" />
}

<div class="mt-4">
  <app-button-generic [buttons]="buttons" />
</div>

<div class="mt-4">
  <app-table-generic
    [formatOptions]="formatOptions"
    [listPagination]="listPagination"
    [dataTable]="fileUploadComponent?.getFiles() || []"
    [headerData]="headerData"
    [operation]="operation"
    [enableDragDrop]="enableDragDrop"
    (reordered)="organizeRow($event)"
  >
  </app-table-generic>
</div>
