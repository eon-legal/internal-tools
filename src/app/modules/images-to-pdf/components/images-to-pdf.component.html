<div
  class="drag-drop-area"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
>
  <div>
    <div class="my-4">{{ note }}</div>
    <div>
      <p-fileUpload
        #fileUpload
        name="myfile[]"
        [chooseLabel]="chooseLabel"
        uploadIcon="pi pi-arrow-down"
        [uploadLabel]="uploadLabel"
        [cancelLabel]="cancelLabel"
        [customUpload]="true"
        styleClass="hidden-file-list"
        [multiple]="true"
        accept="image/*"
        (uploadHandler)="onUpload($event)"
        (onSelect)="onFileSelect($event)"
        auto="false"
        [files]="myfile"
      >
      </p-fileUpload>
    </div>
  </div>
</div>

@if (errorMessage) {
<p-message severity="error" [escape]="false" class="error-message my-4">
  <div [innerHTML]="errorMessage" class="message-content"></div>
</p-message>
}

<div class="mt-4">
  <app-table-generic
    [formatOptions]="formatOptions"
    [listPagination]="listPagination"
    [dataTable]="fileUpload?.files || []"
    [headerData]="headerData"
    [operation]="operation"
    [enableDragDrop]="enableDragDrop"
    (reordered)="organizeRow($event)"
  >
  </app-table-generic>
</div>
