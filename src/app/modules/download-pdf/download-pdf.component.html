<div class="container">
  <p-fileUpload
    #fileUpload
    name="myFiles[]"
    [multiple]="true"
    [customUpload]="true"
    styleClass="hidden-file-list"
    (uploadHandler)="uploadFilesImages($event)"
    accept="{{ acceptedFiles }}"
    invalidFileTypeMessageDetail="Sólo se permiten ficheros con la extensión:  {{
      acceptedFiles
    }}"
  >
  </p-fileUpload>
  <br />
  <br />
  <p-table
    [value]="fileUpload.files"
    [paginator]="true"
    [totalRecords]="fileUpload.files.length"
    [rowsPerPageOptions]="listPagination"
    [rows]="listPagination.length ? listPagination[0] : 5"
    [responsive]="true"
    styleClass="p-datatable-striped"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Tamaño</th>
        <th>Tipo</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-file let-rowIndex="rowIndex">
      <tr>
        <td>{{ file.name }}</td>
        <td>{{ file.size | fileSize }}</td>
        <td>{{ extension(file.type) }}</td>
        <td>
          <p-button
            icon="pi pi-trash"
            [rounded]="true"
            severity="danger"
            (click)="deletefile(file, $event)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
