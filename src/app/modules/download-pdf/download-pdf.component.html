<div class="container mb-2">
  <p-fileUpload
    #fileUpload
    name="myFiles[]"
    [multiple]="true"
    [customUpload]="true"
    styleClass="hidden-file-list"
    (uploadHandler)="uploadFilesImages($event)"
    accept="{{ acceptedFiles }}"
    invalidFileTypeMessageDetail="Sólo se permiten ficheros con la extensión:  {{
      acceptedFiles
    }}"
  >
  </p-fileUpload>
  <br />
  <br />
  </div>

<app-table-generic
  [formatOptions]="formatOptions"
  [dataTable]="fileUpload.files"
  [headerData]="headerData"
  [operation]="operation"
>
<!--
  <ng-template #imageTemplate let-file>
    <img
      [src]="file.objectURL"
      style="width: 100px; height: 100px;"
      alt="Imagen" 
    />
  </ng-template> -->

  <ng-template #imageTemplate let-file>
    @if (file.objectURL) {
      <div class="image-container">
        <img
          [src]="file.objectURL"
          alt="Imagen"
        />
      </div>
    } @else {
      <small>No se pudo cargar la imagen.</small>
    }
  </ng-template>
</app-table-generic>
