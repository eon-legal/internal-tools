server {
    listen 80;
    server_name localhost;

    # Directorio raíz de tu aplicación Angular
    root /usr/share/nginx/html;

    # Configuración para archivos estáticos y manejo de rutas de Angular
    location / {
        try_files $uri $uri/ /index.html; # Quitamos el =404 aquí
    }

    # Configuración adicional para compresión
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Manejo de caché para archivos estáticos
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404; # Aquí sí queremos un 404 si el archivo estático no existe
    }

    # Evitar caché para index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Puedes quitar o dejar esta línea si prefieres que Nginx maneje otros 404 que no sean de Angular.
    # Pero para las rutas de Angular, la línea de try_files del location / es suficiente.
    # error_page 404 /index.html;

    # Manejo de errores
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}