server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html; # Asegúrate de que esta sea la ruta correcta

    # Block known crawler user-agents
    if ($http_user_agent ~* "(Googlebot|Bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|GPTBot|Google-Extended|CCBot|anthropic-ai|ClaudeBot|PerplexityBot|Meta-ExternalAgent|FacebookBot|Bytespider|Amazonbot|cohere-ai|Diffbot)") {
        return 403;
    }

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location / {
        try_files $uri /index.html;
    }
}